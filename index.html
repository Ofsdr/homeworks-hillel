<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>HomeWork 8.1</title>
</head>
<body>
   <h1>Практика float і margin</h1>

  <div class="row">
    <div class="box left"></div>
    <div class="box right"></div>
  </div>

  
  <div class="row">
    <div class="box left"></div>
    <div class="box right"></div>
    <div class="box right gap-right"></div>
    <div class="box right gap-right"></div>
  </div>

  
  <div class="row">
    <div class="box left gap-right"></div>
    <div class="box left"></div>
    <div class="box right"></div>
    <div class="box right gap-right"></div>
  </div>

  
  <div class="row row-tall">
    <div class="right-group">
      <div class="box large"></div>
      <div class="stack">
        <div class="box small-gap"></div>
        <div class="box"></div>
      </div>
    </div>
  </div>

  
  <div class="row row-tall">
    <div class="center-group">
      <div class="box large"></div>
      <div class="stack">
        <div class="box small-gap"></div>
        <div class="box"></div>
      </div>
    </div>
  </div>
</body>
</html>
